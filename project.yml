name: Nomi
options:
  bundleIdPrefix: com.adoyyy
  deploymentTarget:
    iOS: "17.0"
targets:
  Nomi:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: App
      - path: Models
      - path: Views
      - path: Services
      - path: Utilities
      - path: ViewModels
      - path: Repositories
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adoyyy.nomi
      CODE_SIGN_STYLE: Manual
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Nomi needs camera access to scan your receipts."
      INFOPLIST_KEY_NSFaceIDUsageDescription: "Nomi uses Face ID to keep your financial data secure."
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NomiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: Tests
    dependencies:
      - target: Nomi
    settings:
      GENERATE_INFOPLIST_FILE: YES
